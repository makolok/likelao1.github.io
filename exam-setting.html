<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ຕັ້ງຄ່າມື້ສອບເສັງ</title>
    <style>
        body {
            font-family: 'Phetsarath', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .setting-card {
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            border: 2px solid #38bdf8;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { margin-top: 0; font-size: 1.3rem; color: #38bdf8; }
        input[type="date"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #334155;
            color: #ffffff;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .status-info {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #fbbf24;
        }
    </style>
</head>
<body>

    <div class="setting-card">
        <h2>📅 ກຳໜົດມື້ສອບເສັງ</h2>
        <p style="font-size: 0.85rem; color: #cbd5e1;">ເລືອກວ່າມື້ສອບເສັງມື້ໃດ ເພື່ອໃຫ້ລະບົບສົ່ງການແຈ້ງເຕືອນ</p>
        
        <input type="date" id="examDatePicker">

        <!-- คงเหลือปุ่มบันทึกปุ่มเดียว ซึ่งจะบังคับขอสิทธิ์แจ้งเตือนในตัว -->
        <button onclick="saveExamDate()">💾 ບັນທຶກມື້ສອບເສັງ</button>

        <div id="statusInfo" class="status-info"></div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedDate = localStorage.getItem('lao_quiz_exam_date');
            if (savedDate) {
                document.getElementById('examDatePicker').value = savedDate;
                updateStatusText(savedDate);
            }
        });

        // 🛡️ ปรับปรุงฟังก์ชันบันทึก ให้บังคับขอสิทธิ์ Notification อัตโนมัติ
        async function saveExamDate() {
            const selectedDate = document.getElementById('examDatePicker').value;
            if (!selectedDate) {
                alert('ກະລຸນາເລືອກວັນທີ່ສອບເສັງກ່ອນ!');
                return;
            }

            // บังคับขอสิทธิ์แจ้งเตือนจากเบราว์เซอร์ทันที
            if ("Notification" in window) {
                if (Notification.permission !== "granted") {
                    const permission = await Notification.requestPermission();
                    if (permission !== "granted") {
                        alert('⚠️ ທ່ານຕ້ອງກົດອະນຸຍາດ (Allow) ການແຈ້ງເຕືອນ ຈຶ່ງຈະສາມາດຮັບການແຈ້ງເຕືອນວັນສອບໄດ້!');
                        return; // หยุดการบันทึกชั่วคราวเพื่อให้ผู้ใช้กดอนุญาตก่อน
                    }
                }
            }

            // บันทึกข้อมูลวันสอบลงเครื่อง
            localStorage.setItem('lao_quiz_exam_date', selectedDate);
            updateStatusText(selectedDate);

            alert('🎉 ບັນທຶກສຳເລັດ! ລະບົບແຈ້ງເຕືອນອັດຕະໂນມັດພ້ອມແລ້ວ');
            window.location.href = 'index.html';
        }

        function updateStatusText(dateStr) {
            const examDate = new Date(dateStr);
            const today = new Date();
            examDate.setHours(0,0,0,0);
            today.setHours(0,0,0,0);
            const diffTime = examDate.getTime() - today.getTime();
            const daysLeft = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            const infoEl = document.getElementById('statusInfo');
            if (daysLeft > 0) {
                infoEl.innerText = `📌 ເຫຼືອອີກ ${daysLeft} ວັນຈະຮອດມື້ສອບເສັງ`;
            } else if (daysLeft === 0) {
                infoEl.innerText = `🚨 ມື້ນີ້ເປັນມື້ສອບເສັງ!`;
            } else {
                infoEl.innerText = `⚠️ ມື້ສອບເສັງກາຍມາແລ້ວ`;
            }
        }
    </script>
</body>
</html>
