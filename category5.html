<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Quiz ໃບຂັບຂີ່">
    <meta name="theme-color" content="#ffffff">

    <title>ໝວດທີ 5 - ສອບເສັງໃບຂັບຂີ່ ພາກທິດສະດີ</title>
    <link rel="icon" href="data:,">
    <style>
        @font-face {
            font-family: 'Phetsarath';
            src: url('Phetsarath-OT.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }
        body, button, input, select, textarea {
            font-family: 'Phetsarath', sans-serif !important;
        }

        #cat5-body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #000000;
            overflow-x: hidden;
        }

        .cat5-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: 10px;
        }

        .cat5-top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #cbd5e1;
            color: #000000;
        }

        .cat5-exam-grid {
            display: grid;
            grid-template-columns: 200px 1fr 220px;
            gap: 10px;
            flex: 1;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .cat5-sidebar-panel {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            color: #000000;
        }

        .cat5-grid-box {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }

        .cat5-main-content {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            color: #000000;
        }

        .cat5-exam-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #000000;
            margin-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .cat5-q-title {
            font-size: 1.4rem !important;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1.4;
            color: #000000 !important;
        }

        .cat5-img-box {
            text-align: center;
            margin: 10px 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cat5-img-box img {
            width: 100% !important;
            max-width: 550px !important;
            height: auto !important;
            object-fit: contain;
            border-radius: 8px;
            border: 1.5px solid #cbd5e1;
            background: #f8fafc;
            padding: 6px;
        }

        .cat5-options-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .cat5-options-box > div {
            width: 100%;
            min-height: 50px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            padding: 10px 14px;
            border-radius: 8px;
            background: #ffffff !important;
            border: none !important;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            color: #000000 !important;
            box-shadow: none !important;
        }

        .cat5-right-panel {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            color: #000000;
        }

        .cat5-camera-box {
            position: relative;
            width: 100%;
            height: 120px;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
        }

        .cat5-mini-gallery {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            max-height: 120px;
            overflow-y: auto;
            background: #e2e8f0;
            padding: 3px;
            border-radius: 4px;
        }

        .cat5-timer-box {
            text-align: center;
            background: #000000 !important;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
        }

        .cat5-bottom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: #f1f5f9;
            border-top: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        .cat5-img-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        @media screen and (max-width: 768px) {
            .cat5-container {
                width: 100vw;
                height: 100vh;
                padding: 2px;
                justify-content: space-between;
                overflow: hidden;
            }

            .cat5-top-header {
                padding: 4px 6px;
                margin-bottom: 2px;
                font-size: 0.65rem;
                display: flex;
                flex-direction: row !important;
                justify-content: space-between;
                align-items: center;
                white-space: nowrap;
                overflow: hidden;
            }

            .cat5-exam-grid {
                display: grid !important;
                grid-template-columns: 26px 1fr 26px !important;
                gap: 2px;
                flex: 1;
                overflow: hidden;
                margin-bottom: 95px;
                width: 100%;
                box-sizing: border-box;
            }

            .cat5-sidebar-panel {
                display: flex !important;
                padding: 1px !important;
                box-sizing: border-box;
                overflow: hidden;
            }
            .cat5-sidebar-panel div {
                display: none;
            }
            .cat5-grid-box {
                display: grid !important;
                grid-template-columns: 1fr !important;
                gap: 1px;
                overflow-y: auto;
            }
            .cat5-grid-box button {
                padding: 1px 0 !important;
                font-size: 0.55rem !important;
                min-height: 18px;
                width: 100%;
                border: 2.5px solid #000000 !important;
            }

            .cat5-main-content {
                display: flex !important;
                padding: 6px !important;
                overflow-y: auto;
            }

            .cat5-exam-title {
                font-size: 1.1rem;
                margin-bottom: 6px;
                padding-bottom: 4px;
            }
            
            .cat5-q-title {
                font-size: 1.15rem !important;
                margin-bottom: 6px;
            }
            
            .cat5-options-box > div {
                min-height: 48px;
                padding: 8px 10px;
                font-size: 1.15rem !important;
            }

            .cat5-right-panel {
                display: flex !important;
                padding: 1px !important;
                gap: 1px;
                overflow: hidden;
            }
            .cat5-camera-box {
                height: 20px;
            }
            .cat5-mini-gallery {
                max-height: 45px;
                grid-template-columns: repeat(1, 1fr);
            }
            .cat5-timer-box div:first-child {
                display: none;
            }
            .cat5-timer-box div#cat5-timer {
                font-size: 0.4rem !important;
            }

            .cat5-bottom-bar {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                background: #ffffff;
                padding: 6px 4px;
                z-index: 1000;
                display: flex;
                justify-content: space-around;
                align-items: center;
                border-top: 1px solid #cbd5e1;
            }

            .cat5-bottom-bar .cat5-img-btn {
                width: 90px !important;  
                height: 120px !important; 
            }

            .cat5-bottom-bar .cat5-img-btn img {
                width: 100% !important;
                height: 100% !important;
                object-fit: fill !important;
            }
            
            .cat5-img-box img {
                width: 100% !important;
                max-height: 250px !important;
                object-fit: contain !important;
                border-radius: 6px;
            }
        }
    </style>
</head>
<body id="cat5-body">

    <div class="cat5-container">
        
        <!-- 🏷️ แถบหัวข้อด้านบน: รวมคำถามและสถิติรอบไว้ด้วยกันเหมือนหมวด 2 และ 3 เป๊ะ -->
        <div class="cat5-top-header">
            <div style="display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; overflow: hidden;">
                <span id="cat5-progress-text" style="font-size: 0.78rem; font-weight: bold; color: #000000;">ຄຳຖາມທີ 1 ຈາກ 20</span>
                <div id="cat5-round-counter-banner" style="font-size: 0.68rem; font-weight: bold; color: #000000; background: rgba(0, 0, 0, 0.08); padding: 2px 5px; border-radius: 4px; white-space: nowrap;">
                    🏆 ຜ່ານ: <span id="cat5-passed-rounds-count">0</span> ຮອບ | 🔄 ອ່ານ: <span id="cat5-completed-rounds-count">0</span> ຮອບ
                </div>
            </div>
            <span id="cat5-bank-header-badge" style="font-size: 0.75rem; color: #b45309; font-weight: bold; white-space: nowrap;">[ເຫຼືອ: 0]</span>
        </div>

        <div class="cat5-exam-grid">
            
            <div class="cat5-sidebar-panel">
                <div style="font-size: 0.75rem; color: #475569; font-weight: bold; margin-bottom: 4px; text-align: center;">ລາຍຊື່ຂໍ້ສອບ</div>
                <div id="cat5-grid-container" class="cat5-grid-box"></div>
                <div id="cat5-answered-text" style="font-size: 0.7rem; color: #000000; text-align: center; margin-top: 4px; font-weight: bold;">ຕອບແລ້ວ 0 ຂໍ້</div>
            </div>

            <div class="cat5-main-content">
                <div class="cat5-exam-title">ສອບເສັງໃບຂັບຂີ່ ພາກທິດສະດີ</div>
                
                <div id="cat5-question-text" class="cat5-q-title">ກຳລັງໂຫຼດຂໍ້ສອບ...</div>
                <div id="cat5-image-container" class="cat5-img-box"></div>
                <div id="cat5-options-list" class="cat5-options-box"></div>
            </div>

            <div class="cat5-right-panel">
                <div class="cat5-camera-box">
                    <video id="cat5-webcam-video" autoplay playsinline webkit-playsinline muted style="width: 100%; height: 100%; object-fit: cover;"></video>
                    <canvas id="cat5-snapshot-canvas" style="display: none;"></canvas>
                    <div style="position: absolute; bottom: 2px; left: 2px; background: rgba(0,0,0,0.6); color: #22c55e; font-size: 0.55rem; padding: 1px 3px; font-weight: bold;">LIVE 🔴</div>
                </div>
                
                <div id="cat5-snapshots-gallery" class="cat5-mini-gallery"></div>

                <div class="cat5-timer-box">
                    <div style="font-size: 0.75rem; color: #ef4444; font-weight: bold; margin-bottom: 2px;">ເວລາຄົງเหลือ</div>
                    <div id="cat5-timer" style="font-size: 1.5rem; color: #ef4444; font-weight: bold; letter-spacing: 1px;">35:00</div>
                </div>
            </div>

        </div>

        <div class="cat5-bottom-bar">
            <button onclick="cat5PrevOrSubmit()" id="cat5-back-submit-btn" class="cat5-img-btn" title="กลับ / ส่งข้อสอบ">
                <img id="cat5-back-submit-img" src="back.png" alt="ກັບ" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'60\' height=\'45\'><rect width=\'100%\' height=\'100%\' fill=\'%23dc2626\' rx=\'6\'/><text x=\'50%\' y=\'55%\' fill=\'white\' font-size=\'13\' font-weight=\'bold\' text-anchor=\'middle\' dominant-baseline=\'middle\'>ກັບ</text></svg>'">
            </button>
            <button onclick="cat5SelectOption(0)" class="cat5-img-btn" title="เลือก ก">
                <img src="a.png" alt="ກ" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'55\' height=\'45\'><circle cx=\'27\' cy=\'22\' r=\'20\' fill=\'%23dc2626\'/><text x=\'50%\' y=\'55%\' fill=\'white\' font-size=\'14\' font-weight=\'bold\' text-anchor=\'middle\' dominant-baseline=\'middle\'>ກ</text></svg>'">
            </button>
            <button onclick="cat5SelectOption(1)" class="cat5-img-btn" title="เลือก ข">
                <img src="b.png" alt="ຂ" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'55\' height=\'45\'><circle cx=\'27\' cy=\'22\' r=\'20\' fill=\'%23dc2626\'/><text x=\'50%\' y=\'55%\' fill=\'white\' font-size=\'14\' font-weight=\'bold\' text-anchor=\'middle\' dominant-baseline=\'middle\'>ຂ</text></svg>'">
            </button>
            <button onclick="cat5SelectOption(2)" class="cat5-img-btn" title="เลือก ค">
                <img src="c.png" alt="ຄ" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'55\' height=\'45\'><circle cx=\'27\' cy=\'22\' r=\'20\' fill=\'%23dc2626\'/><text x=\'50%\' y=\'55%\' fill=\'white\' font-size=\'14\' font-weight=\'bold\' text-anchor=\'middle\' dominant-baseline=\'middle\'>ຄ</text></svg>'">
            </button>
            <button onclick="cat5SelectOption(3)" class="cat5-img-btn" title="เลือก ง">
                <img src="d.png" alt="ງ" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'55\' height=\'45\'><circle cx=\'27\' cy=\'22\' r=\'20\' fill=\'%23dc2626\'/><text x=\'50%\' y=\'55%\' fill=\'white\' font-size=\'14\' font-weight=\'bold\' text-anchor=\'middle\' dominant-baseline=\'middle\'>ງ</text></svg>'">
            </button>
            <button onclick="cat5NextQuestion()" class="cat5-img-btn" title="ข้อถัดไป / ข้าม">
                <img src="next.png" alt="ຂ້າມ" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'60\' height=\'45\'><rect width=\'100%\' height=\'100%\' fill=\'%230284c7\' rx=\'6\'/><text x=\'50%\' y=\'55%\' fill=\'white\' font-size=\'13\' font-weight=\'bold\' text-anchor=\'middle\' dominant-baseline=\'middle\'>ຂ້າມ</text></svg>'">
            </button>
        </div>

        <!-- 📊 หน้าจอสรุปผลหมวด 5 -->
        <div id="cat5-result-screen" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #ffffff; text-align: center; padding: 20px; color: #000000; flex-direction: column; justify-content: center; align-items: center; box-sizing: border-box; z-index: 9999;">
            
            <div style="max-width: 480px; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <h2 style="font-size: 1.3rem; font-weight: bold; margin-bottom: 10px; color: #000000;">ສອບເສັງໃບຂັບຂີ່ ພາກທິດສະດີ</h2>
                
                <div id="cat5-final-score" style="margin: 4px 0; font-size: 1.1rem; font-weight: bold; color: #000000 !important;">ຕອບຜິດ 0 ຂໍ້ ໃນທັງໝົດ 20 ຂໍ້</div>
                <div id="cat5-total-rounds-summary" style="margin: 4px 0 10px 0; font-size: 0.95rem; font-weight: bold; color: #0369a1 !important;"></div>

                <div id="cat5-pass-fail-big-text" style="margin: 10px 0; font-size: 3rem; font-weight: bold; line-height: 1.2;">ຜ່ານ</div>
                
                <div id="cat5-result-action-buttons" style="display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 15px;"></div>
            </div>

        </div>

    </div>

    <script src="category5.js"></script>
</body>
</html>
